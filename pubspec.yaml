name: flucobuild
description: Fluco Build — ابنِ تطبيقات Flutter من هاتفك عبر GitHub Actions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  archive: ^3.6.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0

flutter:
  uses-material-design: true
